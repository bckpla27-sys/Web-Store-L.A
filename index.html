<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress benign Vite dev server WebSocket disconnect and HMR client errors in preview iframe
      (function () {
        function isViteHmrError(msg, src) {
          var str = (String(msg || '') + ' ' + String(src || '')).toLowerCase();
          return (
            str.indexOf('websocket') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('vite') !== -1
          );
        }
        var prevOnError = window.onerror;
        window.onerror = function (msg, url, line, col, error) {
          if (isViteHmrError(msg, url)) return true;
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
        };
        window.addEventListener(
          'error',
          function (e) {
            if (isViteHmrError(e.message, e.filename)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var reason = e.reason ? String(e.reason.message || e.reason) : '';
            if (isViteHmrError(reason, '')) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
